name: Build and Deploy to Webuzo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-22.04

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRE: ${{ secrets.JWT_EXPIRE }}
      STORE_NAME: ${{ secrets.STORE_NAME }}
      STORE_CURRENCY: ${{ secrets.STORE_CURRENCY }}
      STORE_TAX_RATE: ${{ secrets.STORE_TAX_RATE }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
      FTP_PORT: ${{ secrets.FTP_PORT || '21' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deploy secrets
        run: |
          missing=0
          for name in NEXT_PUBLIC_API_URL MONGODB_URI MONGODB_DB_NAME JWT_SECRET STORE_NAME STORE_CURRENCY STORE_TAX_RATE FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$FTP_PROTOCOL" != "ftp" ] && [ "$FTP_PROTOCOL" != "ftps" ]; then
            echo "::error::FTP_PROTOCOL must be either ftp or ftps. Use an SFTP action instead if your server only supports SFTP."
            missing=1
          fi
          exit "$missing"

      - name: Build Next.js
        run: npm run build

      - name: Prepare deploy folder
        run: |
          mkdir deploy
          cp -a .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          mkdir -p deploy/_next
          cp -r .next/static deploy/_next/static
          cp -r public deploy/public
          rm -rf deploy/.git deploy/.github deploy/.env.local deploy/.env.example
          mkdir -p deploy/tmp
          echo "restarted at $(date -u +%Y-%m-%dT%H:%M:%SZ) - ${GITHUB_SHA}" > deploy/tmp/restart.txt
          node -e "const fs=require('fs');const p='deploy/server.js';let s=fs.readFileSync(p,'utf8');s=s.replace(\"process.env.HOSTNAME || '0.0.0.0'\", \"process.env.HOSTNAME || '127.0.0.1'\");fs.writeFileSync(p,s);"
          cp deploy/server.js deploy/app.js
          node -e "const fs=require('fs');const p='deploy/package.json';const pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.scripts={start:'node server.js'};pkg.main='server.js';pkg.engines={node:'20.x'};fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"
          {
            echo "NODE_ENV=production"
            echo "HOSTNAME=127.0.0.1"
            echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
            echo "MONGODB_URI=${MONGODB_URI}"
            echo "MONGODB_DB_NAME=${MONGODB_DB_NAME}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "JWT_EXPIRE=${JWT_EXPIRE:-7d}"
            echo "STORE_NAME=${STORE_NAME}"
            echo "STORE_CURRENCY=${STORE_CURRENCY}"
            echo "STORE_TAX_RATE=${STORE_TAX_RATE}"
          } > deploy/.env.production
          cp deploy/.env.production deploy/.env

      - name: Upload to Webuzo by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          port: ${{ env.FTP_PORT }}
          local-dir: ./deploy/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
