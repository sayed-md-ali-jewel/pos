name: Build and Deploy to Webuzo

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRE: ${{ secrets.JWT_EXPIRE }}
      STORE_NAME: ${{ secrets.STORE_NAME }}
      STORE_CURRENCY: ${{ secrets.STORE_CURRENCY }}
      STORE_TAX_RATE: ${{ secrets.STORE_TAX_RATE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Prepare deploy folder
        run: |
          mkdir deploy
          cp -r .next/standalone/* deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          {
            echo "NODE_ENV=production"
            echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
            echo "MONGODB_URI=${MONGODB_URI}"
            echo "MONGODB_DB_NAME=${MONGODB_DB_NAME}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "JWT_EXPIRE=${JWT_EXPIRE}"
            echo "STORE_NAME=${STORE_NAME}"
            echo "STORE_CURRENCY=${STORE_CURRENCY}"
            echo "STORE_TAX_RATE=${STORE_TAX_RATE}"
          } > deploy/.env.production
          {
            echo "process.env.PORT = process.env.PORT || '30153';"
            echo "require('./server.js');"
          } > deploy/start.js

      - name: Upload to Webuzo by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /git/pos/
